name: Trigger auto deployment for fetch

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ working_branch_non ]
    paths:
    - '**'
    - '.github/workflows/fetch-AutoDeployTrigger-9fa7021e-c94a-4a73-a9e7-8183409ff828.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.FETCH_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.FETCH_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.FETCH_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: index.docker.io/v1
          registryUsername: ${{ secrets.FETCH_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.FETCH_REGISTRY_PASSWORD }}
          containerAppName: fetch
          resourceGroup: rg-app-261019182315
          imageToBuild: index.docker.io/v1/fetch:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


