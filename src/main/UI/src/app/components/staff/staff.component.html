<div class="scene" id="staffView">
  <article class="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1>Staff Directory</h1>
      <a routerLink="/staff/form" class="btn btn-primary btn-lg">+ Add Staff Member</a>
    </div>

    <div class="row" *ngIf="staffMembers && staffMembers.length > 0; else noStaff">
      <div class="col-12">
        <div class="table-responsive">
          <table class="table table-striped align-middle">
            <thead>
              <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Phone</th>
                <th>Position</th>
                <th>Hire Date</th>
                <th>On Call Duty</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let member of staffMembers">
                <td><strong>{{member.id}}</strong></td>
                <td>{{member.name}}</td>
                <td>{{member.phone}}</td>
                <td>{{member.position}}</td>
                <td>{{member.hire_date | date:'yyyy-MM-dd'}}</td>
                <td>{{member.on_call_duty ? 'Yes' : 'No'}}</td>
                <td>
                  <a [routerLink]="['/staff/form', member.id]" class="btn btn-sm btn-outline-primary me-1">Edit</a>
                  <button type="button" class="btn btn-sm btn-outline-danger" (click)="onDeleteStaff(member.id)">Delete</button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <ng-template #noStaff>
      <p class="mt-3 text-muted">No staff records found.</p>
    </ng-template>

  </article>
</div>
