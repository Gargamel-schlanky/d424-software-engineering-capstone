<div class="scene" id="intakeFormView">
  <article class="content">

    <div class="row">
      <div class="col-12 col-md-8 offset-md-2">
        <h1>{{ isEditMode ? 'Edit Intake Record' : 'New Animal Intake' }}</h1>
        <form class="form-horizontal" [formGroup]="animalIntake" (ngSubmit)="onSubmit()">

          <!-- 1. Intake Date -->
          <div class="form-group mb-3">
            <label for="intake_date" class="form-label">Intake Date:</label>
            <input id="intake_date" type="date" class="form-control" formControlName="intake_date" required>
          </div>

          <!-- 2. Animal Type -->
          <div class="form-group mb-3">
            <label for="TYPE" class="form-label">Animal Type:</label>
            <select id="TYPE" class="form-select" formControlName="TYPE">
              <option value="DOG">DOG</option>
              <option value="CAT">CAT</option>
              <option value="OTHER">OTHER</option>
              <option value="WILD_REHAB">WILD_REHAB</option>
              <option value="UNKNOWN">UNKNOWN</option>
            </select>
          </div>

          <!-- 3. Needs Medical -->
          <div class="form-group mb-3">
            <label for="needs_medical" class="form-label">Needs Medical Care?</label>
            <select id="needs_medical" class="form-select" formControlName="needs_medical">
              <option [ngValue]="false">No</option>
              <option [ngValue]="true">Yes</option>
            </select>
          </div>

          <!-- 4. Select Existing Animal -->
          <div class="form-group mb-3">
            <label for="animal_id" class="form-label">Select Existing Animal (Optional):</label>
            <select id="animal_id" class="form-select" formControlName="animal_id">
              <option value="">-- None / Create New Animal Below --</option>
              <option *ngFor="let anim of animals" [value]="anim.id">
                ID: {{anim.id}} - {{anim.name || 'Unnamed Animal'}} ({{anim.age || 'Age Unknown'}})
              </option>
            </select>
          </div>

          <!-- 5. Create New Animal Section (if no existing animal selected) -->
          <div *ngIf="!animalIntake.value.animal_id" class="p-3 mb-3 border rounded bg-light">
            <h5 class="text-primary mb-3">Create & Populate New Animal Record (Optional)</h5>

            <div class="form-group mb-2">
              <label for="new_animal_name" class="form-label">Animal Name:</label>
              <input id="new_animal_name" type="text" class="form-control" formControlName="new_animal_name" placeholder="e.g. Max / Bella">
            </div>

            <div class="form-group mb-2">
              <label for="new_animal_age" class="form-label">Animal Age:</label>
              <input id="new_animal_age" type="text" class="form-control" formControlName="new_animal_age" placeholder="e.g. 2 years">
            </div>

            <div class="form-group mb-2">
              <label for="new_animal_description" class="form-label">Animal Description:</label>
              <input id="new_animal_description" type="text" class="form-control" formControlName="new_animal_description" placeholder="Description / breed details">
            </div>

            <div class="form-group mb-2">
              <label for="photo" class="form-label">Upload Animal Photo:</label>
              <input id="photo" type="file" class="form-control" accept="image/*" (change)="onPhotoSelected($event)">
              <div *ngIf="selectedPhotoUrl" class="mt-2">
                <img [src]="selectedPhotoUrl" style="max-height: 80px; border-radius: 4px;" alt="Preview">
              </div>
            </div>
          </div>

          <!-- 6. Staff Member Selection -->
          <div class="form-group mb-3">
            <label for="staff_id" class="form-label">Intake Staff Member (Optional):</label>
            <select id="staff_id" class="form-select" formControlName="staff_id">
              <option value="">-- None / Select Staff Member (Optional) --</option>
              <option *ngFor="let st of staffList" [value]="st.id">
                ID: {{st.id}} - {{st.name}} ({{st.position || 'Staff'}})
              </option>
            </select>
          </div>

          <div class="form-group mt-4 d-flex gap-2">
            <button type="submit" class="btn btn-primary btn-lg" [disabled]="!animalIntake.valid">
              {{ isEditMode ? 'Update Intake Record' : 'Submit Intake Record' }}
            </button>
            <button type="button" class="btn btn-secondary btn-lg" (click)="onCancel()">Cancel</button>
          </div>

        </form>
      </div>
    </div>

  </article>
</div>
