<div class="scene" id="staffFormView">
  <article class="content">

    <div class="row">
      <div class="col-12 col-md-8 offset-md-2">
        <h1>{{ isEditMode ? 'Edit Staff Member' : 'Add New Staff Member' }}</h1>
        <form class="form-horizontal" [formGroup]="staffForm" (ngSubmit)="onSubmit()">

          <div class="form-group mb-3">
            <label for="name" class="form-label">Name:</label>
            <input id="name" type="text" class="form-control" formControlName="name" placeholder="Staff Name" required>
          </div>

          <div class="form-group mb-3">
            <label for="phone" class="form-label">Phone Number:</label>
            <input id="phone" type="text" class="form-control" formControlName="phone" placeholder="e.g. 555-123-4567">
          </div>

          <div class="form-group mb-3">
            <label for="position" class="form-label">Job Title / Position:</label>
            <input id="position" type="text" class="form-control" formControlName="position" placeholder="e.g. Veterinarian Technician">
          </div>

          <div class="form-group mb-3">
            <label for="hire_date" class="form-label">Hire Date:</label>
            <input id="hire_date" type="date" class="form-control" formControlName="hire_date">
          </div>

          <div class="form-group mb-3">
            <label for="on_call_duty" class="form-label">On Call Duty?</label>
            <select id="on_call_duty" class="form-select" formControlName="on_call_duty">
              <option [ngValue]="false">No</option>
              <option [ngValue]="true">Yes</option>
            </select>
          </div>

          <div class="form-group mt-4 d-flex gap-2">
            <button type="submit" class="btn btn-primary btn-lg" [disabled]="!staffForm.valid">
              {{ isEditMode ? 'Update Staff Member' : 'Save Staff Member' }}
            </button>
            <button type="button" class="btn btn-secondary btn-lg" (click)="onCancel()">Cancel</button>
          </div>

        </form>
      </div>
    </div>

  </article>
</div>
