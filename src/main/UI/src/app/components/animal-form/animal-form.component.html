<div class="scene" id="animalFormView">
  <article class="content">

    <div class="row">
      <div class="col-12 col-md-8 offset-md-2">
        <h1>{{ isEditMode ? 'Edit Animal' : 'Add New Animal' }}</h1>
        <form class="form-horizontal" [formGroup]="addAnimalForm" (ngSubmit)="onSubmit()">

          <div class="form-group mb-3">
            <label for="name" class="form-label">Name:</label>
            <input id="name" type="text" class="form-control" formControlName="name" placeholder="Animal Name" required>
          </div>

          <div class="form-group mb-3">
            <label for="age" class="form-label">Age:</label>
            <input id="age" type="text" class="form-control" formControlName="age" placeholder="e.g. 2 years, 6 months">
          </div>

          <div class="form-group mb-3">
            <label for="description" class="form-label">Description:</label>
            <input id="description" type="text" class="form-control" formControlName="description" placeholder="Short description">
          </div>

          <div class="form-group mb-3">
            <label for="medical_id" class="form-label">Medical ID:</label>
            <input id="medical_id" type="number" class="form-control" formControlName="medical_id" placeholder="0">
          </div>

          <div class="form-group mb-3">
            <label for="adoptable" class="form-label">Adoptable?</label>
            <select id="adoptable" class="form-select" formControlName="adoptable">
              <option [ngValue]="true">Yes</option>
              <option [ngValue]="false">No</option>
            </select>
          </div>

          <div class="form-group mb-3">
            <label for="current_resident" class="form-label">Current Resident?</label>
            <select id="current_resident" class="form-select" formControlName="current_resident">
              <option [ngValue]="true">Yes</option>
              <option [ngValue]="false">No</option>
            </select>
          </div>

          <!-- Photo Upload Field -->
          <div class="form-group mb-3">
            <label for="photo" class="form-label">Upload Animal Photo (Optional):</label>
            <input id="photo" type="file" class="form-control" accept="image/*" (change)="onPhotoSelected($event)">
            <div *ngIf="selectedPhotoUrl" class="mt-2">
              <img [src]="selectedPhotoUrl" style="max-height: 100px; border-radius: 6px;" alt="Photo Preview">
            </div>
          </div>

          <div class="form-group mt-4 d-flex gap-2">
            <button type="submit" class="btn btn-primary btn-lg" [disabled]="!addAnimalForm.valid">
              {{ isEditMode ? 'Update Animal' : 'Save Animal' }}
            </button>
            <button type="button" class="btn btn-secondary btn-lg" (click)="onCancel()">Cancel</button>
          </div>

        </form>
      </div>
    </div>

  </article>
</div>
