<header id="intro" style="display: block;">
  <article class="fullheight" style="height: 250px;">
    <div class="hgroup">
      <h1>Fetch!</h1>
      <h2>Animal Rescue Helper</h2>
    </div>
  </article>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
  integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
  <div class="scrollmagic-pin-spacer"
       style="display: block; top: auto; left: auto; bottom: auto; right: auto; position: relative; margin: 0 auto auto; box-sizing: content-box; width: 100%; min-height: 44px; height: auto; padding-top: 0; padding-bottom: 0;">
    <nav id="nav" style="position: relative; top: 0; left: 0; bottom: auto; right: auto; width: 100%;">
      <div class="navbar d-flex justify-content-between align-items-center flex-wrap">
        <div class="brand"><a routerLink="/intake"><span>Fetch! Rescue</span></a></div>
        <ul class="nav">
          <li><a routerLink="/intake" routerLinkActive="active">Intakes</a></li>
          <li><a routerLink="/animals" routerLinkActive="active">Animals</a></li>
          <li><a routerLink="/medical" routerLinkActive="active">Medical</a></li>
          <li><a routerLink="/staff" routerLinkActive="active">Staff</a></li>
          <li><a routerLink="/reports" routerLinkActive="active">Reports</a></li>
        </ul>

        <!-- Page-wide Search Bar -->
        <div class="header-search-container my-2 me-3 position-relative" style="min-width: 250px; max-width: 350px;">
          <div class="input-group">
            <span class="input-group-text bg-white border-end-0">🔍</span>
            <input
              type="text"
              class="form-control border-start-0 ps-0"
              placeholder="Search page..."
              [value]="searchQuery"
              (input)="onSearchChange($any($event.target).value)"
            >
            <button
              *ngIf="searchQuery"
              type="button"
              class="btn btn-outline-secondary border-start-0"
              (click)="clearSearch()"
              title="Clear Search"
            >✕</button>
          </div>
        </div>

      </div><!-- navbar -->
    </nav>
  </div>
</header>

<main id="wrapper">
  <router-outlet></router-outlet>
</main>

<footer class="scene py-3 text-center text-muted">
  <article class="content">
    <p class="mb-0">&copy; Fetch! Animal Rescue Helper</p>
  </article>
</footer>
